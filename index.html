'use strict';

const DECKS=[{"id":"c1","name":"Cancer Part 1","desc":"Neoplasia · cell biology · genetics","accent":"purple","cards":[["Tumour","Abnormal tissue swelling/growth; does not automatically mean cancer."],["Neoplasia","New uncontrolled growth lacking normal cell-division regulation; may be benign or malignant."],["Cancer","Malignant neoplasia with uncontrolled division and altered differentiation."],["Hyperplasia","Increase in the number of cells; distinct from invasive cancer."],["Dysplasia","Abnormal cell arrangement, size, shape or maturation."],["Carcinoma in situ","Malignant-appearing epithelial cells still confined above the basement membrane; noninvasive."],["Invasive neoplasm","Tumour cells have penetrated their original boundary/basement membrane."],["Incidence","Number or rate of new cancer diagnoses over a specified time."],["Prevalence","Number or proportion of people living with a disease at a point/period."],["Mortality","Number or rate of deaths due to cancer over a specified time."],["2022 Canada: incidence top five","Lung/bronchus; breast; prostate; colorectal; bladder (combined sexes, lecture slide)."],["2022 Canada: mortality top five","Lung/bronchus; colorectal; pancreas; breast; prostate (combined sexes, lecture slide)."],["Benign neoplasm","Usually slow-growing, well-differentiated, localized and often encapsulated; does not metastasize."],["Malignant neoplasm","Invades nearby tissues and can spread; often less differentiated and poorly circumscribed."],["Differentiation","How closely tumour cells resemble the normal tissue of origin."],["Anaplasia","Loss of normal differentiation; cells look unlike mature cells of their tissue."],["Pleomorphism","Marked variation in cellular or nuclear size and shape."],["Encapsulation","A well-defined capsule surrounding a growth, usually associated with benign tumours."],["Invasion","Destruction/penetration of neighbouring tissues by malignant cells."],["Necrosis","Cell/tissue death; may occur when a rapidly growing tumour exceeds its blood supply."],["Benign tumour harms","Can compress tissue, obstruct an organ or release excess hormones despite not metastasizing."],["Adeno-","Gland or duct; adenoma = usually benign; adenocarcinoma = malignant glandular epithelium."],["Fibro-","Fibrous connective tissue; fibroma = benign; fibrosarcoma = malignant."],["Lipo-","Fat; lipoma = benign fatty tumour; liposarcoma = malignant."],["Chondro-","Cartilage; chondroma = benign; chondrosarcoma = malignant."],["Osteo-","Bone; osteoma = benign; osteosarcoma = malignant."],["Leiomyo-","Smooth muscle; leiomyoma = benign; leiomyosarcoma = malignant."],["Rhabdomyo-","Striated muscle; rhabdomyosarcoma = malignant skeletal-muscle-type tumour."],["Neuro-","Nerve/neural tissue (prefix)."],["Glio-","Glial tissue (supporting cells of nervous system)."],["-oma","Usually denotes a benign tumour, but important exceptions exist."],["-carcinoma","Malignant neoplasm of epithelial origin."],["-sarcoma","Malignant neoplasm of mesenchymal/connective tissue origin."],["Melanoma","Malignant neoplasm of pigment-producing melanocytes despite ending in -oma."],["Lymphoma","Malignant neoplasm of lymphatic/lymphoid tissue despite ending in -oma."],["Leukemia","Malignant disease of blood-forming tissues with abnormal blood cells."],["Growth-factor independence","Cells divide with reduced need for normal external growth signals."],["Loss of density-dependent inhibition","Cells keep proliferating despite crowding/contact with neighbours."],["Cellular autonomy","Decreased dependence on control and attachment by neighbouring cells."],["Cadherins","Cell-adhesion proteins; their loss helps tumour cells detach and move."],["Anchorage independence","Ability to survive/divide without normal attachment to a substrate."],["Telomerase","Enzyme maintaining telomeres, enabling repeated cell division."],["Avoidance of apoptosis","Cancer cells evade programmed cell-death signals."],["Genetic instability","High tendency to acquire further DNA/chromosome changes."],["Angiogenesis","Formation of blood vessels feeding a growing tumour."],["VEGF","Vascular endothelial growth factor; signals new blood-vessel growth."],["Collagenase","Tissue-digesting enzyme used to degrade extracellular matrix during invasion."],["Autocrine motility factor (AMF)","Signal promoting cancer-cell movement and motility."],["Metastasis","Spread of malignant cells to secondary sites distant from the primary tumour."],["Direct invasion","Tumour growth into immediately adjacent tissues."],["Seeding","Tumour cells spread across surfaces within a body cavity."],["Lymphatic spread","Cancer cells enter lymph vessels and travel to lymph nodes/other sites."],["Sentinel lymph node","First lymph node draining a primary tumour region."],["Hematogenous spread","Cancer cells disseminate through the bloodstream, often into veins."],["First-capillary-bed pattern","Circulating malignant cells often lodge first in lung or liver capillaries."],["Organ tropism","Some cancers preferentially colonize organs with favourable local environments."],["Proto-oncogene","Normal growth-promoting gene ('GO' signal), e.g. RAS."],["Oncogene","Activated growth gene promoting uncontrolled proliferation; often a one-copy gain-of-function change."],["RAS","Example of a growth-signalling proto-oncogene that can become an oncogene."],["Tumour-suppressor gene","Gene restricting growth or promoting repair ('STOP' signal); often both copies must be lost."],["TP53 / p53","Tumour suppressor that pauses the cell cycle, promotes DNA repair or triggers apoptosis."],["Tumour heterogeneity","Tumour contains subpopulations with differing acquired mutations."],["Somatic mutation","Mutation in a body cell; generally not passed to offspring."],["Germline mutation","Mutation in a reproductive cell lineage that can be inherited."],["BRCA1","Inherited tumour-suppressor susceptibility gene linked especially with breast/ovarian cancer."],["APC","Tumour-suppressor gene; inherited function escapeHtml(v){return String(v).replace(/[&<>"']/g, x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function getDateKey(ms=Date.now()){const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function stats(deckId){const cards=deckId==='all'?CARDS:CARDS.filter(c=>c.deck===deckId);const now=Date.now();let unseen=0,learn=0,review=0,dueLearn=0,dueReview=0,mastered=0,seen=0;for(const c of cards){const r=cardState(c.id);if(r.state==='new'){unseen++;continue;}seen++;if(['learning','relearning'].includes(r.state)){learn++;if(r.dueAt<=now)dueLearn++;}else if(r.state==='review'){review++;if(r.dueAt<=now)dueReview++;if(r.intervalDays>=21)mastered++;}}return {total:cards.length,unseen,learn,review,dueLearn,dueReview,due:dueLearn+dueReview,mastered,seen};}
function firstIntroductions(deckId,date=getDateKey()){return data.history.filter(h=>h.wasNew&&h.deck===deckId&&getDateKey(h.ts)===date).length;}
function ratingCount(date=getDateKey()){return data.history.filter(h=>getDateKey(h.ts)===date).length;}
function distinctToday(){return new Set(data.history.filter(h=>getDateKey(h.ts)===getDateKey()).map(h=>h.id)).size;}
function streak(){const days=new Set(data.history.map(h=>getDateKey(h.ts)));let n=0;const date=new Date();if(!days.has(getDateKey(date.getTime())))date.setDate(date.getDate()-1);while(days.has(getDateKey(date.getTime()))){n++;date.setDate(date.getDate()-1);}return n;}
function dueCards(deckId,excludeId){const now=Date.now();return CARDS.filter(c=>(deckId==='all'||c.deck===deckId)&&c.id!==excludeId&&hasSeen(c)&&cardState(c.id).dueAt<=now).sort((a,b)=>{let as=cardState(a.id),bs=cardState(b.id);let ap=(as.state==='learning'||as.state==='relearning')?0:1,bp=(bs.state==='learning'||bs.state==='relearning')?0:1;return ap-bp||as.dueAt-bs.dueAt||a.order-b.order;});}
function newCards(deckId,excludeId){const days={};const arr=CARDS.filter(c=>(deckId==='all'||c.deck===deckId)&&c.id!==excludeId&&!hasSeen(c)&&((data.settings.dailyNew===9999)||(firstIntroductionsCached(c.deck,days)<data.settings.dailyNew)||ui.extraNew[c.deck]));if(!data.settings.shuffleNew)return arr;return arr.slice().sort((a,b)=>hash(a.id)-hash(b.id));}
function firstIntroductionsCached(deck,cache){if(!(deck in cache))cache[deck]=firstIntroductions(deck);return cache[deck];}

function nextCardId(deckId){const due=dueCards(deckId);if(due.length)return due[0].id;const n=newCards(deckId);return n.length?n[0].id:null;}
function nextDue(deckId){const arr=CARDS.filter(c=>(deckId==='all'||c.deck===deckId)&&hasSeen(c)&&cardState(c.id).dueAt>Date.now()).map(c=>cardState(c.id).dueAt);return arr.length?Math.min(...arr):null;}
function formatDuration(ms,short=false){if(ms<=0)return 'now';if(ms<60000)return short?'<1m':'less than a minute';if(ms<3600000)return Math.ceil(ms/MIN)+'m';if(ms<DAY)return Math.round(ms/3600000)+'h';if(ms<DAY*30)return Math.round(ms/DAY)+'d';if(ms<DAY*365)return Math.round(ms/DAY/30)+'mo';return (ms/DAY/365).toFixed(1)+'y';}
function nextSchedule(r,rating,now=Date.now()){
  const previous={...r};let next={...r};let duration=MIN;

  }else{

function insightsHTML(){const s=stats('all');let total=data.history.length,successful=data.history.filter(h=>h.rating==='good'||h.rating==='easy').length;return `<div class="pagehead"><div class="eyebrow">YOUR LEARNING</div><h1>Study progress</h1><p>See how much you've covered and how your spaced reviews are going.</p></div><section class="stats"><div class="stat"><div class="stat-label">Cards introduced</div><div class="stat-number">${s.seen}</div><div class="stat-foot">${Math.round(s.seen/s.total*100)}% covered</div></div><div class="stat"><div class="stat-label">Total ratings</div><div class="stat-number">${total}</div><div class="stat-foot">${ratingCount()} today</div></div><div class="stat"><div class="stat-label">Good / Easy ratings</div><div class="stat-number">${total?Math.round(100*successful/total)+'%':'—'}</div><div class="stat-foot">Of all past ratings</div></div><div class="stat"><div class="stat-label">Due now</div><div class="stat-number">${s.due}</div><div class="stat-foot">Learning + review</div></div></section><section class="two-col"><div class="card-panel"><h2 class="side-title">Coverage by deck</h2>${DECKS.map(d=>{const n=stats(d.id),pct=n.seen/n.total*100;return `<div class="bar-row"><div class="bar-label">${escapeHtml(d.name)}</div><div class="bar-bg"><div class="bar-val" style="width:${pct}%;background:${d.id==='c1'?'#988cfa':d.id==='c2'?'#5ed4b6':'#edae64'}"></div></div><div class="bar-count">${n.seen}/${n.total}</div></div>`}).join('')}</div><div class="card-panel"><h2 class="side-title">Your card states</h2>${[['Unseen',s.unseen,'#8d98ae'],['Learning',s.learn,'#e7b975'],['Scheduled review',s.review,'#64c6af'],['Long interval (21d+)',s.mastered,'#8d84f0']].map(([l,n,col])=>`<div class="bar-row"><div class="bar-label">${l}</div><div class="bar-bg"><div class="bar-val" style="width:${n/s.total*100}%;background:${col}"></div></div><div class="bar-count">${n}</div></div>`).join('')}</div></section><section class="two-col" style="margin-top:17px function settingsHTML(){return `<div class="pagehead"><div class="eyebrow">YOUR STUDY PREFERENCES</div><h1>Settings & backups</h1><p>Customize your daily learning pace and keep a portable copy of your review history.</p></div><section class="two-col"><div class="card-panel"><h2 class="side-title">Study preferences</h2><div class="settings-row"><div><div class="settings-label">New cards per day, per deck</div><div class="settings-desc">Due reviews are always available. Limit only applies to new cards.</div></div><select id="daily-new" class="select" aria-label="New cards per day">${[10,20,30,50,100,9999].map(x=>`<option value="${x}" ${data.settings.dailyNew===x?'selected':''}>${x===9999?'Unlimited':x}</option>`).join('')}</select></div><div class="settings-row"><div><div class="settings-label">Shuffle unseen cards</div><div class="settings-desc">Study new cards in a consistent shuffled order instead of CSV order.</div></div><input id="shuffle-new" type="checkbox" ${data.settings.shuffleNew?'checked':''} aria-label="Shuffle unseen cards" style="width:22px;height:22px;accent-color:#8884ef"></div><div class="settings-row"><div><div class="settings-label">Appearance</div><div class="settings-desc">Light or dark mode</div></div><button class="btn small" data-action="theme">Switch theme</button></div></div><div class="card-panel"><h2 class="side-title">Your progress backup</h2><p class="muted smalltext">Your cards and scheduling information are stored only in this browser. Export before changing devices, clearing Brave or Safari data, or using private browsing.</p><div class="btn-row" style="margin:18px 0"><button class="btn primary small" data-action="export">↓ Export progress</button><button class="btn small" data-action="import">↑ Import progress</button></div><div class="review-note">Importing a backup replaces your current saved progress. You will be asked to confirm before anything changes.</div><p class="subtle tiny" style="margin-top:12px" id="settings-storage">${storageOK?'Auto-save is available in this browser.':'Auto-save is unavailable. Export your progress before leaving.'}</p></div></section><div class="card-panel" style="margin-top:17px"><h2 class="side-title">How spaced repetition works here</h2><p class="muted smalltext">This site follows the active-recall and rating workflow of Anki, but uses a simplified scheduler rather than Anki's FSRS algorithm.</p><div style="overflow:auto"><table class="schedule-table"><thead><tr><th>Rating</th><th>While learning a new card</th><th>After graduation to review</th></tr></thead><tbody><tr><td><strong>Again</strong></td><td>Try again after ~1 minute</td><td>Return to short relearning (~10 minutes)</td></tr><tr><td><strong>Hard</strong></td><td>Try again after ~5–10 minutes</td><td>Small interval increase (~1.2×)</td></tr><tr><td><strong>Good</strong></td><td>10-minute step, then 1-day review</td><td>Interval grows based on ease factor</td></tr><tr><td><strong>Easy</strong></td><td>Graduate immediately (4 days)</td><td>Longest interval and increased ease factor</td></tr></tbody></table></div><p class="muted tiny" style="margin:14px 0 0">A card becomes "due" when its scheduled time arrives. The scheduler uses your device's clock and saves every rating.</p></div><div class="danger-zone" style="margin-top:17px"><h2 class="side-title" style="color:var(--red)">Reset study history</h2><p class="muted smalltext">This cannot be undone without a backup. Your 292 original flashcards will never be deleted.</p><div class="btn-row"><button class="btn small danger" data-action="resetDeck" data-deck="c1">Reset Cancer 1</button><button class="btn small danger" data-action="resetDeck" data-deck="c2">Reset Cancer 2</button><button class="btn small danger" data-action="resetDeck" data-deck="msk">Reset MSK</button><button class="btn small danger" data-action="resetAll">Reset all decks</button></div></div>`;}

function exportProgress(){const content={app:'PATH Recall',version:1,exportedAt:new Date().toISOString(),cards:CARDS.length,records:data.records,history:data.history,settings:data.settings};const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='PATH_Recall_Progress_'+getDateKey()+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Progress backup downloaded');}
async function importProgress(file){if(!file)return;try{const json=JSON.parse(await file.text());if(!json||json.version!==1||!json.records||!Array.isArray(json.history))throw Error('Not a valid PATH Recall backup.');const records={};for(const [id,r] of Object.entries(json.records)){if(!CARD_BY_ID[id]||typeof r!=='object'||r===null||!['learning','relearning','review'].includes(r.state)||!Number.isFinite(r.dueAt))continue;records[id]={state:r.state,step:Math.max(0,Math.min(1,Number(r.step)||0)),intervalDays:Math.max(0,Number(r.intervalDays)||0),ease:Math.max(1.3,Math.min(3.5,Number(r.ease)||2.5)),dueAt:r.dueAt,reps:Math.max(0,Number(r.reps)||0),lapses:Math.max(0,Number(r.lapses)||0),firstSeenAt:r.firstSeenAt||0,lastRatedAt:r.lastRatedAt||0};}
const history=json.history.filter(h=>CARD_BY_ID[h.id]&&ratingLabels.includes(h.rating)&&Number.isFinite(h.ts)&&h.ts>=0).slice(-30000).map(h=>({...h,prior:(h.prior&&typeof h.prior==='object')?h.prior:null,wasNew:!!h.wasNew,deck:CARD_BY_ID[h.id].deck}));if(!confirm('Import this progress backup? It will replace the current study history on this device.'))return;data.records=records;data.history=history;if(json.settings){data.settings.dailyNew=[10,20,30,50,100,9999].includes(Number(json.settings.dailyNew))?Number(json.settings.dailyNew):20;data.settings.shuffleNew=!!json.settings.shuffleNew;}ui.activeId=null;ui.revealed=false;ui.extraNew={};save();render();toast('Imported '+Object.keys(records).length+' studied cards');}catch(e){alert('Could not import backup: '+e.message);}}
function handleAction(action,element){if(action==='home'||action==='nav'){navigate(element.dataset.page||'overview');return;}if(action==='start'){navigate('study',element.dataset.deck);return;}if(action==='theme'){let theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('path_recall_theme',theme)}catch(e){}render();return;}if(action==='reveal'){if(ui.view==='study'&&ui.activeId){ui.revealed=true;render();}return;}if(action==='rate'){grade(element.dataset.rating);return;}if(action==='undo'){undo();return;}if(action==='refresh-queue'){ui.activeId=null;ui.revealed=false;render();return;}if(action==='extra-new'){ui.extraNew[element.dataset.deck]=true;ui.activeId=null;render();return;}if(action==='browseDeck'){ui.browseDeck=element.dataset.deck;ui.browseQuery='';ui.browseFilter='all';navigate('browse');return;}if(action==='browseOpen'){ui.browseOpen=ui.browseOpen===element.dataset.id?null:element.dataset.id;updateBrowse();return;}if(action==='studySingle'){const card=CARD_BY_ID[element.dataset.id];if(card){navigate('study',card.deck);ui.activeId=card.id;ui.revealed=false;render();}return;}if(action==='export'){exportProgress();return;}if(action==='import'){document.getElementById('import-file').click();return;}if(action==='resetDeck'){resetDeck(element.dataset.deck);return;}if(action==='resetAll'){resetAll();return;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){if(el.hasAttribute('disabled'))return;handleAction(el.dataset.action,el);}});
document.addEventListener('keydown',e=>{if((e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')||e.metaKey||e.ctrlKey||e.altKey)return;if(e.target.closest?.('[data-action="home"]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();navigate('overview');return;}if(ui.view!=='study')return;if(e.key===' '){e.preventDefault();if(!ui.revealed&&ui.activeId){ui.revealed=true;render();}return;}if(ui.revealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();grade(ratingLabels[Number(e.key)-1]);}});
document.addEventListener('input',e=>{if(e.target.id==='browse-search'){ui.browseQuery=e.target.value;ui.browseOpen=null;updateBrowse();}});
document.addEventListener('change',e=>{if(e.target.id==='browse-deck'){ui.browseDeck=e.target.value;ui.browseOpen=null;updateBrowse();}if(e.target.id==='browse-filter'){ui.browseFilter=e.target.value;ui.browseOpen=null;updateBrowse();}if(e.target.id==='daily-new'){data.settings.dailyNew=Number(e.target.value);ui.extraNew={};save();render();toast('Daily new-card limit saved');}if(e.target.id==='shuffle-new'){data.settings.shuffleNew=e.target.checked;save();toast('New-card order updated');}if(e.target.id==='import-file'){importProgress(e.target.files[0]);e.target.value='';}});
setInterval(()=>{if(ui.view==='study'&&!ui.activeId){const next=nextCardId(ui.deck);if(next){render();return;}const due=nextDue(ui.deck);const count=document.getElementById('next-due-countdown');if(count&&due)count.textContent=formatDuration(due-Date.now());}},5000);
(function init(){try{const theme=localStorage.getItem('path_recall_theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch(e){}checkStorage();load();render();})();
</script>
</body>
